# Taplo owns the hand-written TOML surface: the compose contract, package
# manifests, towncrier, cargo-deny, and tool configuration. The lockfiles are
# emitted by their package managers; formatting them would rewrite evidence.
#
# CI runs both commands below. `lint` catches parse and schema errors; `fmt
# --check` catches layout drift without writing the tree.

include = [ "**/*.toml" ]

exclude = [
  "**/.venv/**",
  "**/__pycache__/**",
  "**/.ruff_cache/**",
  "**/.zig-cache/**",
  "**/target/**",
  "**/zig-out/**",
  "**/zig-pkg/**",
  "**/Cargo.lock",
  "**/uv.lock",
  "mise.lock",
]

[formatting]
align_entries = false
align_comments = true
array_trailing_comma = true
array_auto_expand = true
array_auto_collapse = false
compact_arrays = false
compact_inline_tables = false
compact_entries = false
inline_table_expand = true
column_width = 100
indent_tables = false
indent_entries = false
indent_string = "  "
trailing_newline = true
reorder_keys = false
reorder_arrays = false
reorder_inline_tables = false
allowed_blank_lines = 2
crlf = false

# Taplo 0.9 cannot reliably validate Cargo and pyproject schemas whose external
# references move independently. Their native cargo, uv, ruff, and clippy
# gates are stricter; the self-contained schemas below resolve cleanly.
[[rule]]
include = [ ".taplo.toml", "**/.taplo.toml", "**/taplo.toml" ]

[rule.schema]
path = "taplo://taplo.toml"

[[rule]]
include = [ "**/rust-toolchain.toml" ]

[rule.schema]
url = "https://www.schemastore.org/rust-toolchain.json"

[[rule]]
include = [ "**/rustfmt.toml", "**/.rustfmt.toml" ]

[rule.schema]
url = "https://www.schemastore.org/rustfmt.json"

[[rule]]
include = [ ".mise.toml", "**/.mise.toml", "**/mise.toml" ]

[rule.schema]
url = "https://mise.jdx.dev/schema/mise.json"

[[rule]]
include = [ ".typos.toml", "**/.typos.toml", "**/typos.toml" ]

[rule.schema]
url = "https://raw.githubusercontent.com/crate-ci/typos/master/config.schema.json"
