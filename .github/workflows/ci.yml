# What has to be true before a change lands.
#
# Six product gates plus four discipline gates, ten jobs, deliberately not one:
# a Zig engine regression, a Rust clippy nit, and a poisoned workflow are
# different news. What blast adds over the packages it composes is the first
# step of every runtime job below - blast contains neither engine, so CI has to
# assemble the ecosystem before it can configure. The discipline jobs read this
# repository only and stay cheap enough to fail before that build matters.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push mid-run should cancel the run it obsoleted, not race it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  engine:
    # Both host families, because the build branches on them: macOS re-archives
    # through `libtool` for ld64's alignment rules, and the composed face links
    # a dylib against the substrate's, which is a different loader on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: blast
    steps:
      # ── the sibling problem, and why the checkout looks like this ──
      #
      # blast has the only two-level path graph in the ecosystem. Its own
      # build.zig.zon points at ../irregex and ../relate; relate's build.zig.zon
      # then points at ../irregex and ../gist of its own; and build.zig installs
      # ../gist/include/gist.h beside its header, because the C ABI names
      # gist_engine even though blast takes no Zig module dep on gist. So a bare
      # clone cannot configure, and a naive fix that adds relate alone still
      # cannot: relate would arrive looking for siblings nobody fetched.
      #
      # actions/checkout refuses any path outside the workspace, so `path: ../…`
      # is not on the table. The fix is to move the whole layout down one level:
      # this repository lands in blast/ rather than at the root, and the three
      # packages it needs land beside it —
      #
      #   $GITHUB_WORKSPACE/{blast,irregex,relate,gist}
      #
      # — which is exactly the flat arrangement every repo in the ecosystem
      # already assumes, so both levels resolve for the same reason: blast finds
      # ../irregex and ../relate, and relate finds the ../irregex and ../gist
      # beside itself. The bindings agree one level deeper (they reach
      # ../../../<sibling>/bindings/<lang>), so the same checkout serves every
      # job here. It is also the layout a developer already has on disk, which is
      # the point: CI resolves these the way a laptop does, not a special way.
      #
      # Siblings track their default branch on purpose. Path deps mean blast is
      # judged against the tip of what it composes; a release pins url+hash
      # instead, and that is the day this stops being a checkout problem.
      #
      # `relate` is not a public repository, so the default GITHUB_TOKEN cannot
      # read it. ECOSYSTEM_TOKEN is a secret with read access to it; the
      # fallback keeps the two public packages fetchable without one, so a fork
      # gets three of four repos and a legible failure rather than a mystery.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: blast
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/relate
          path: relate
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/gist
          path: gist
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Compile-only first: when this fails, the test log below is noise, and
      # the failure is one line rather than a suite's worth of scrollback.
      - run: zig build check
      - run: zig build test
      # The default install step, which `check` and `test` both skip: it is the
      # only rung that runs the macOS libtool re-archive, links libblast against
      # libirgx, and stages the three headers. Those are the artifact a
      # consumer receives, and macOS is the half of this matrix that has its own
      # code path through them.
      - run: zig build --summary none
      # `zig build coverage` is deliberately absent: it shells kcov, which is on
      # neither runner image, and installing it would buy a number nothing here
      # gates on. It stays a local instrument.

  python:
    # Three interpreters in one job rather than a matrix over three runners.
    # This suite cannot skip its way to green — the composed verbs answer through
    # real `blast`, `relate`, and `gist` binaries, and the packaging tests load
    # real libraries — so every leg would pay for a full ecosystem build, three
    # times, to prove something that is only ever interpreter-level. One build,
    # three steps: a version that breaks still names itself in the log.
    #
    # 3.12 is the declared floor (`requires-python = ">=3.12"`, tracking the
    # irregex substrate) and there is no upper pin, so the top of the range is
    # tested rather than assumed — a published library has no business refusing
    # next year's interpreter, and the way to keep that true is to notice.
    runs-on: ubuntu-latest
    steps:
      # Same four-repo layout as the engine job; see the comment there.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: blast
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/relate
          path: relate
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/gist
          path: gist
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Without this the whole suite skips itself and reports green over nothing:
      # every composed test is guarded on a resolvable binary, and the packaging
      # pair is guarded on a built library. Each package is built in its own
      # checkout because that is where the bindings look — the resolver walks to
      # the checkout that owns a name and reads its zig-out/, so `gist` comes
      # from gist/, `relate` from relate/, libirgx from irregex/, and blast's
      # own binary and dylib from here. (It would otherwise build them itself,
      # mid-test, inside a 600 s timeout; better to pay it once, in the open.)
      - name: Build the binaries and libraries the suite drives
        run: |
          for package in irregex gist relate blast; do
            ( cd "$package" && zig build --summary none )
          done
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: pytest on 3.12 (the declared floor)
        working-directory: blast/bindings/python
        run: uv run --python 3.12 pytest -q
      - name: pytest on 3.13
        working-directory: blast/bindings/python
        run: uv run --python 3.13 pytest -q
      - name: pytest on 3.14
        working-directory: blast/bindings/python
        run: uv run --python 3.14 pytest -q

  go:
    # The Go module is pure Go by default (the in-process tier is behind
    # `-tags irgx_ffi`), so nothing here needs cgo or a prebuilt archive.
    # Both engines are still built, because the composed verbs answer through
    # them: without a reachable binary those tests skip, and a job that vets a
    # module without running its subject is a green tick over an untested seam.
    #
    # Building them is now the whole job. The resolver reads the env override,
    # then a built zig-out/bin/<name> up the tree, then the sibling checkout
    # that owns the name, then PATH — and the four-repo layout above is exactly
    # what the sibling rung is describing, so `blast` comes from blast/ and
    # `relate` from relate/ with nothing exported. The PATH export this job used
    # to carry was covering for a rung that pointed into the monorepo these
    # packages were extracted from; it resolved nothing here and hid the gap.
    #
    # The step below asserts no test skipped itself, which is the thing PATH was
    # really insuring against — and unlike PATH it fails loudly instead of
    # quietly papering over a resolver that stopped working.
    runs-on: ubuntu-latest
    steps:
      # Same four-repo layout as the engine job; see the comment there. gist is
      # needed even though no Go code touches it: relate's package graph and
      # blast's header install both reach for it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: blast
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/relate
          path: relate
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/gist
          path: gist
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build --summary none
        working-directory: blast
      - run: zig build --summary none
        working-directory: relate
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: blast/bindings/go/go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          working-directory: blast/bindings/go
      - run: go vet ./...
        working-directory: blast/bindings/go
      - name: go test, and prove no test skipped itself
        working-directory: blast/bindings/go
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
            echo "::error::a test skipped itself — an engine binary did not resolve"
            exit 1
          fi

  rust:
    # The only job that needs no Zig and no ecosystem build. This crate is a
    # subprocess face — its vendor/ carries no archive of its own — and its tests
    # are builder smoke: they prove a composed request lowers into an argv and
    # that a missing scope is a typed refusal, neither of which opens a binary.
    # The irregex checkout is here for the path dependency alone; the archive
    # cargo links comes prebuilt in that repo.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blast/bindings/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: blast
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      # rust-toolchain.toml pins the channel; installing it explicitly would
      # override the pin the repository already made.
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A prebuilt binary rather than the Docker action, which takes a
      # repo-root-relative manifest path and would have to be told about a
      # layout that differs in every one of these repositories. This is a
      # plain step, so it inherits the working directory and the toolchain
      # rustup already resolved above.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny@0.19.0
      # deny.toml has been checked in the whole time with nothing running it.
      # `check` is all four: a RustSec advisory against anything in the graph,
      # the banned crates that would mean this binding grew a TLS stack or an
      # async runtime, the license allowlist, and the registries a crate may
      # come from.
      - run: cargo deny check

  fmt:
    # Zig was the one language here whose formatter nothing checked, while Rust
    # got `cargo fmt --check` in the job above. That gap is not academic: `zig
    # fmt` pads a column-aligned multiline literal into a grid, so a rename that
    # shrinks the widest cell leaves every row beneath it one space too wide, in
    # files nobody touched. Drift like that wants a red X that says "formatting",
    # not one buried in a build log. blast owns few enough Zig files that a gate
    # sounds like overkill, which is exactly the size of tree where drift sits
    # unnoticed the longest.
    #
    # Its own job for the same reason the other four are separate, and the
    # cheapest one here by a distance — the single checkout below is the whole
    # setup, because reading files is not configuring a build and none of the
    # two-level path dependencies apply. Even `rust`, the other job that skips
    # the ecosystem, still needs irregex on disk for a path dependency; this one
    # needs nothing. So there is no `path:` and no `working-directory`: the
    # repository is the workspace, which is what makes `git ls-files` mean this
    # repository rather than whichever sibling landed first.
    #
    # Pinned to the ZIG_VERSION everything else builds with, because the
    # formatter's output is a property of the compiler release — checking against
    # a different Zig would be checking against a different grid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt --check
        run: |
          set -euo pipefail
          # Enumerated rather than spelled out as a path list, because a path
          # list drifts the same silent way the formatting does — it goes stale
          # the moment a directory is added or renamed, and stale in the
          # direction that checks less. That matters more here than the current
          # file count suggests: blast's Zig lives entirely under one subtree
          # today, and a path list would quietly stop covering the day it does
          # not.
          #
          # Tracked plus untracked-not-ignored is every Zig file this repository
          # owns. What that leaves out is exactly the ignored trees — `.zig-cache`
          # and the fetched `zig-pkg/`, which parks a whole `build.zig` of its
          # own — so the exclusions are named in `.gitignore` and reviewable
          # there, rather than being whatever happened to fall outside an
          # argument list.
          #
          # The existence test is for a working tree mid-edit, where the index
          # can still name a file someone has deleted; CI's checkout never has
          # one, and a stale index should not read as a formatting failure.
          files=()
          while IFS= read -r f; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done < <(git ls-files -co --exclude-standard '*.zig')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::found no .zig files — the enumeration is broken, not the tree" >&2
            exit 1
          fi
          echo "checking ${#files[@]} files"
          zig fmt --check "${files[@]}"

  docs:
    # Markdown is the largest authored surface here, and spelling is the same
    # kind of news: the public explanation changed shape or says the wrong
    # thing. Both tools honor gitignore, so fetched Zig packages never become
    # our prose to repair.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  config:
    # YAML and TOML are executable configuration here; EditorConfig is the
    # byte-level contract beneath both. They share one lightweight job because
    # a failure means the same thing: an authored config no longer parses,
    # formats, or agrees with the editor policy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --with yamllint==1.38.0 yamllint .
      - run: uv run --no-project --with taplo==0.9.3 taplo lint
      - run: uv run --no-project --with taplo==0.9.3 taplo fmt --check
      - run: uv run --no-project --with editorconfig-checker==3.8.0 ec

  python-lint:
    # Python tests need the four-repo ecosystem; static judgment does not.
    # Keeping Ruff here catches a six-file typo without first compiling Zig.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --with ruff==0.16.1 ruff check --config quality/ruff.toml .
      - run: uv run --no-project --with ruff==0.16.1 ruff format --check --config quality/ruff.toml .

  actions-sec:
    # A workflow can be valid YAML and still leak a token or trust a movable
    # tag. GitHub Actions is the only CI plane, so its security gets its own red
    # X rather than hiding beneath general config style.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --with zizmor==1.29.0 zizmor --no-online-audits --strict-collection .

  topology:
    # `contract/blast.zone` declares this package's import topology - the zone
    # stack, the sealed deep modules, the guest lists, the reach ceiling, the
    # cycle ban - and until this job existed, nothing read it. Zig has no
    # visibility rules between files inside a package and its analysis is lazy
    # enough that a genuine import cycle still compiles, so every boundary the
    # READMEs describe was convention with nothing standing behind it. A
    # declaration nobody enforces is a comment.
    #
    # Pinned like every other tool in this file, and installed the same way, so
    # this job's verdict moves when we move it. No Zig and no build: zoning reads
    # the tree, not a build graph, so it is one of the fastest jobs here.
    name: topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # The fix is in the code, or in a `variance ... because "..."` that says
      # what would retire it - never in quietly widening the contract to match
      # what the imports happen to do today.
      - name: Import topology
        run: uv run --no-project --with zoning==0.1.0 zoning verify

  version:
    # One number lives in `build.zig.zon`; the publishing manifests that cannot
    # import it — Cargo and PyPI — carry a marked copy the release bot rewrites.
    # This asks whether those copies still agree, and whether the bot has been
    # told about every one of them. A mirror the config forgot is the
    # interesting failure: nothing breaks until a release ships a package
    # claiming last version's number.
    #
    # Stdlib-only, no Zig and no build — it reads lines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --python 3.12 python tools/version_parity.py

      # Every index this project publishes to shows the repository README as the
      # project's page, and each one resolves a relative link against its own
      # URL rather than against GitHub. `registry_readme.py` corrects that at
      # package time; this proves, on every commit, that it still can — a link
      # to a file somebody moved fails here rather than at the release, or worse,
      # as a well-formed URL on a published page pointing at nothing.
      - run: uv run --no-project --python 3.12 python tools/registry_readme.py --check
