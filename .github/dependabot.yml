# Automated dependency updates.
#
# Four manifests, four ecosystems, one weekly window. The bindings are small,
# which makes a stale dependency easier to miss by eye rather than less costly.
# Grouped updates keep that vigilance from becoming review-queue noise.
#
# Zig remains manual: Dependabot has no Zig ecosystem, and the package graph is
# three sibling checkouts whose release pins must move with tested source.
version: 2

updates:
  # A compromised action runs with this repository's token and, in build jobs,
  # a token that can read the three sibling repositories.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["type/deps", "area/ci"]

  # The binding's direct crate is local; tempfile and the transitive graph are
  # still registry dependencies and deserve the same weekly review.
  - package-ecosystem: cargo
    directory: /bindings/rust
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/rust"]

  # The toolchain is a separate authority from Cargo dependencies. Monthly is
  # deliberate; a compiler bump can reshape rustfmt and Clippy together.
  - package-ecosystem: rust-toolchain
    directory: /bindings/rust
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/rust"]

  # There are no third-party Go requires today. Keeping the updater present
  # catches the day that stops being true and keeps the declared Go floor live.
  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/go"]

  # Runtime stays stdlib-thin; this watches the development tools and uv.lock.
  - package-ecosystem: uv
    directory: /bindings/python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/python"]
