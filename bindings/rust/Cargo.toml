# Standalone crate root — lifts out of this repo for a public release without
# inheriting a parent workspace's lockfile or lint config.
[workspace]

[package]
# `blast` on crates.io is an unrelated crate, and crate names are permanent,
# so this takes the same `-search` name the PyPI distribution does. The `[lib]`
# below keeps the identifier callers actually type as `blast`.
name = "blast-search"
version = "1.1.0"                                                                                                                                                                 # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Blast-radius and provenance analysis for Rust - what breaks if I change this symbol, and where a pasted snippet came from, read from the bytes on disk right now."
# The crates.io landing page is the repository's own README, not the short one
# beside these sources - crates.io shows a README as the whole project page, and
# a visitor who lands there has nowhere else to look. Cargo has no metadata hook,
# so `tools/registry_readme.py` mints a link-corrected copy here and this points
# at it. Regenerate immediately before `cargo package`, never earlier: a missing
# file fails loudly and a stale one would ship quietly, so absent is the safe
# state to leave it in. The file is gitignored, and `cargo build` never reads it.
readme = "PROJECT_README.md"
homepage = "https://github.com/The-Billy-Company/blast"
repository = "https://github.com/The-Billy-Company/blast"
documentation = "https://github.com/The-Billy-Company/blast/blob/main/bindings/rust/README.md"
authors = [ "The Billy Company" ]
# "composed verbs" is how this crate is built, not what it is for. The five
# slots go to the two questions it answers, in the words they get asked in.
keywords = [ "blast-radius", "impact-analysis", "refactoring", "code-search", "provenance" ]
categories = [ "development-tools", "text-processing", "api-bindings", "algorithms" ]

# `LICENSE` and `NOTICE` are copies of the repository's, kept beside this manifest
# rather than referenced upward: Cargo cannot package a file outside the crate
# directory, so without the copies an Apache-2.0 crate shipped no license text and
# no attribution notice at all - the two things section 4 of that license requires a
# redistributor to hand on. Keep them byte-identical to the root pair.
#
# `rust-toolchain.toml` is deliberately not shipped. It pins 1.96.0 so this
# repository's contributors lint identically, which is no business of someone
# building the extracted crate - and it would silently override the 1.85
# `rust-version` above, which is the floor the sources actually ask for.
exclude = [ "/target", "/.cargo", "/rust-toolchain.toml" ]

# Load-bearing, not decorative: the package is `blast-search` on the index, so
# without this the library would be `blast_search` and every caller would have
# to type it. `use blast::…` is the API.
[lib]
name = "blast"

[dependencies]
# Local path for in-tree development. A published build ignores it and resolves
# the same version range of `irgx` through the registry; the path override is
# only for this checkout. Blast also depends on relate in Zig; the binding
# only needs the shared substrate for row decode / transports.
irgx = { version = "1.0.0", path = "../../../irregex/bindings/rust" }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
