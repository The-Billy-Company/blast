# Importable Python face of blast. Depends on `irregex` (substrate) and `relate`
# (corpus helpers shared by composed verbs). Local checkouts resolve both path
# editably; a published wheel depends on the PyPI distributions.
#
# The floor tracks the `irregex` substrate's, since this package cannot import
# without it. There is no upper bound: the monorepo this was extracted from
# pins one interpreter, but a published library has no business refusing 3.15.
#
# The distribution is `blast-search`; the import stays `blast`. The bare name on
# PyPI belongs to an unrelated author (a web music player), so publishing under
# it was never available — and a plain `pip install blast` fetches that
# stranger's package into a tree that then imports `blast`. Splitting the two
# names is the same shape bs4, PIL, and cv2 already ship, and the same split
# `gist-search` and `relate-search` made next door. Both siblings this depends
# on are spelled by their distribution names below for the same reason.

[project]
name = "blast-search"
version = "1.0.0"                                                                                                                                                                   # x-release-please-version
description = "Blast-radius and provenance analysis for Python - what breaks if I change this symbol, and where a pasted snippet came from, read from the bytes on disk right now."
# The long description is the repository's own README, lifted and link-corrected
# at build time by `hatch_readme.py`. PyPI opens onto the project's front door,
# not onto a second one kept beside this file.
dynamic = [ "readme" ]
requires-python = ">=3.12"
license = "Apache-2.0"
# Copies of the repository's pair, kept beside this manifest because a build backend
# packages nothing from above the project directory. Without them the wheel carried an
# SPDX expression and no licence text - and no NOTICE, which section 4 of Apache-2.0
# requires a redistributor to hand on. Named here rather than left to the sdist so
# they land in the wheel's `.dist-info/licenses/` too. Keep byte-identical to the root.
license-files = [ "LICENSE", "NOTICE" ]
authors = [ { name = "The Billy Company" } ]
# Two questions, two vocabularies. "What breaks if I change this" is searched
# as blast radius / impact analysis / find references / change impact; "where
# is this text from" is searched as provenance / attribution / plagiarism.
# Neither audience knows the word "composed verbs", so it is not here.
keywords = [
  "blast-radius",
  "impact-analysis",
  "change-impact-analysis",
  "code-impact",
  "find-references",
  "call-graph",
  "dependency-analysis",
  "code-navigation",
  "refactoring",
  "codebase-analysis",
  "static-analysis",
  "provenance",
  "code-attribution",
  "attribution",
  "plagiarism-detection",
  "code-search",
  "cross-reference",
  "symbol-search",
  "developer-tools",
  "agent-tools",
]
dependencies = [
  # Bounded on both sides. `irgx` is the import this package opens with, and it
  # only exists from 1.0.0 — the 0.1.0 on the index is the pre-rename placeholder,
  # which an unbounded requirement resolves to happily and which cannot satisfy a
  # single line here. The ceiling is the same fact from the other side: 1.0.0 is
  # where the substrate froze the C ABI and the `irgx` surface, and a 2.0 is free
  # to move both. blast composes relate's kinship verbs the same way, so its
  # requirement is bounded for the same reason and at its own version.
  "irregex>=1.0.0,<2",
  "relate-search>=1.0.0,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Zig",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/The-Billy-Company/blast"
Documentation = "https://github.com/The-Billy-Company/blast#readme"
Repository = "https://github.com/The-Billy-Company/blast"
Issues = "https://github.com/The-Billy-Company/blast/issues"
Changelog = "https://github.com/The-Billy-Company/blast/blob/main/CHANGELOG.md"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.wheel]
packages = [ "blast" ]

[tool.uv.sources]
irregex = { path = "../../../irregex/bindings/python", editable = true }
gist-search = { path = "../../../gist/bindings/python", editable = true }
relate-search = { path = "../../../relate/bindings/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  # The build backend, here because `test_description.py` drives the metadata
  # hook that decides what PyPI shows.
  "hatchling>=1.27",
  # distribution `gist-search`, import `gist` — the bare name was taken on PyPI.
  "gist-search", # oracle face for exact-search checks in behavioral tests
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM" ]
ignore = [ "E501" ]

[tool.ruff.lint.isort]
known-first-party = [ "blast", "relate", "irgx", "gist" ]
