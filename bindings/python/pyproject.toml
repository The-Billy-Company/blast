# Importable Python face of blast. Depends on `irregex` (substrate) and `relate`
# (corpus helpers shared by composed verbs). Local checkouts resolve both path
# editably; a published wheel depends on the PyPI distributions.
#
# The floor tracks the `irregex` substrate's, since this package cannot import
# without it. There is no upper bound: the monorepo this was extracted from
# pins one interpreter, but a published library has no business refusing 3.15.

[project]
name = "blast"
version = "0.1.0"
description = "Importable Python API for blast composed search verbs."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "irregex",
  "relate",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "blast" ]

[tool.uv.sources]
irregex = { path = "../../../irregex/bindings/python", editable = true }
gist = { path = "../../../gist/bindings/python", editable = true }
relate = { path = "../../../relate/bindings/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  "gist",  # oracle face for exact-search checks in behavioral tests
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["blast", "relate", "irregex", "gist"]
